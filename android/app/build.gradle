plugins {
    id 'com.android.application'
}

// Release signing is owner-controlled and optional. Credentials live in
// android/keystore.properties, which is git-ignored and never committed. Without
// that file the release build still assembles, just unsigned, so anyone can build
// the project without holding the key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProperties.getProperty(it) }
    if (missing) throw new GradleException("keystore.properties is missing: ${missing.join(', ')}")
    if (!rootProject.file(keystoreProperties.getProperty('storeFile')).exists()) {
        throw new GradleException("Keystore not found at ${keystoreProperties.getProperty('storeFile')}")
    }
}

android {
    namespace 'com.houseofkiran'
    compileSdk 36

    defaultConfig {
        applicationId 'com.houseofkiran'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def serverUrl = providers.gradleProperty('serverBaseUrl').orElse('').get()
        if (serverUrl && !(serverUrl ==~ /https?:\/\/[a-zA-Z0-9.:-]+/)) throw new GradleException('serverBaseUrl must be an HTTP(S) origin')
        buildConfigField 'String', 'SERVER_BASE_URL', '"' + serverUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

// Root files are the source of truth. Every APK receives the current game UI.
tasks.register('syncGameAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'House_of_Kiran_AI_Stage3_6_PRODUCTION.html', 'online-ui.js', 'app-shell.js', 'app.css', 'banner-*.webp', 'fonts/**'
    }
    into('src/main/assets/game')
}
tasks.named('preBuild').configure { dependsOn('syncGameAssets') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
