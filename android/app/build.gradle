plugins {
    id 'com.android.application'
}

android {
    namespace 'com.houseofkiran'
    compileSdk 36

    defaultConfig {
        applicationId 'com.houseofkiran'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def serverUrl = providers.gradleProperty('serverBaseUrl').orElse('').get()
        if (serverUrl && !(serverUrl ==~ /https?:\/\/[a-zA-Z0-9.:-]+/)) throw new GradleException('serverBaseUrl must be an HTTP(S) origin')
        buildConfigField 'String', 'SERVER_BASE_URL', '"' + serverUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Root files are the source of truth. Every APK receives the current game UI.
tasks.register('syncGameAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'House_of_Kiran_AI_Stage3_6_PRODUCTION.html', 'online-ui.js', 'app-shell.js', 'app.css', 'banner-*.webp', 'fonts/**'
    }
    into('src/main/assets/game')
}
tasks.named('preBuild').configure { dependsOn('syncGameAssets') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
